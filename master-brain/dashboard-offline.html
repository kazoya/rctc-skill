<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماستر برين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f0efe9; --line:#e3e1d8; --line-strong:#cfccc0;
  --ink:#141a29; --ink-2:#3d4658; --muted:#6b7386; --muted-2:#8b91a1;
  --accent:#9c7c33; --accent-ink:#7d621f; --accent-soft:#f2ebd9;
  --navy:#16233f;
  --ok:#2f855a; --warn:#b26a12; --bad:#b3392f; --info:#2f5fc0; --violet:#6b4fc4;
  --shadow:0 1px 2px rgba(20,26,41,.06), 0 8px 24px -12px rgba(20,26,41,.18);
  --radius:10px;
  --display:"Rubik","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Rubik",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#131a2c; --surface-2:#182137; --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
    --ink:#eef1f8; --ink-2:#c6cde0; --muted:#93a0bd; --muted-2:#6f7c99;
    --accent:#d3b978; --accent-ink:#e6d3a1; --accent-soft:rgba(211,185,120,.14);
    --navy:#0f1830;
    --ok:#43b581; --warn:#e0a63e; --bad:#e8695e; --info:#6f9bf0; --violet:#a48af0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#131a2c; --surface-2:#182137; --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
  --ink:#eef1f8; --ink-2:#c6cde0; --muted:#93a0bd; --muted-2:#6f7c99;
  --accent:#d3b978; --accent-ink:#e6d3a1; --accent-soft:rgba(211,185,120,.14);
  --navy:#0f1830;
  --ok:#43b581; --warn:#e0a63e; --bad:#e8695e; --info:#6f9bf0; --violet:#a48af0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;font-feature-settings:"kern";text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:-.02em}

/* ── shell ─────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1340px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:9px;background:linear-gradient(145deg,var(--navy),#2b3c63);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.04em;box-shadow:var(--shadow)}
.brand b{font-family:var(--display);font-size:17px;font-weight:700;display:block;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:2px;margin-inline-start:auto;background:var(--surface-2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{background:none;border:0;padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.icon-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1340px;margin:0 auto;padding:20px 22px 64px}

/* ── snapshot notice ───────────────────────────────── */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--radius);padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--ink-2)}
.notice b{color:var(--ink)}
.notice .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}

/* ── instrument strip ──────────────────────────────── */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:20px}
.cell{padding:11px 15px;border-inline-end:1px solid var(--line)}
.cell:last-child{border-inline-end:0}
.cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:600}
.cell .v{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25;margin-top:1px}
.cell .sub{font-size:11.5px;color:var(--muted)}
.meterline{height:3px;border-radius:2px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.meterline i{display:block;height:100%;background:var(--accent)}

/* ── layout ────────────────────────────────────────── */
.split{display:grid;grid-template-columns:308px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:940px){.split{grid-template-columns:1fr}}
.rail{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;position:sticky;top:74px}
@media (max-width:940px){.rail{position:static}}
.rail-h{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2)}
.rail-h span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:700}
.filters{display:flex;gap:4px;padding:9px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filters button{background:none;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.plist{list-style:none;margin:0;padding:0}
.plist li{border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.prow{width:100%;text-align:start;background:none;border:0;padding:11px 14px;cursor:pointer;display:block;border-inline-start:3px solid transparent}
.prow:hover{background:var(--surface-2)}
.prow[aria-current="true"]{background:var(--surface-2);border-inline-start-color:var(--accent)}
.prow .pn{font-weight:600;font-size:14px;line-height:1.35;display:block}
.prow .pm{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:5px;font-size:11px;color:var(--muted)}
.prow .bar{height:4px;border-radius:2px;background:var(--surface-2);margin-top:7px;overflow:hidden}
:root[data-theme="dark"] .prow .bar{background:rgba(255,255,255,.08)}
.prow .bar i{display:block;height:100%;background:var(--accent)}

/* ── project head ──────────────────────────────────── */
.phead{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.phead h2{font-size:23px;font-weight:700;line-height:1.25}
.phead .alt{color:var(--muted);font-size:13.5px;margin-top:2px}
.phead p{color:var(--ink-2);margin:11px 0 0;max-width:66ch;font-size:14px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid}
.pill.tag{border-color:var(--line);color:var(--muted);background:var(--surface-2)}
.st{--c:var(--muted)}
.st.active{--c:var(--ok)} .st.planning{--c:var(--info)} .st.paused{--c:var(--warn)} .st.blocked{--c:var(--bad)} .st.done{--c:var(--accent)} .st.dormant{--c:var(--muted-2)}
.pill.status{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.pill.model{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);font-size:11px}
.gauge{display:flex;align-items:center;gap:10px;margin-top:14px}
.gauge .bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;max-width:340px}
:root[data-theme="dark"] .gauge .bar{background:rgba(255,255,255,.08)}
.gauge .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff))}
.gauge b{font-family:var(--display);font-size:19px;font-weight:700}

/* ── brain columns ─────────────────────────────────── */
.brain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1100px){.brain{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.brain{grid-template-columns:1fr}}
.colhead{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted-2);padding:0 2px 7px;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;justify-content:space-between}
.sec{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden;border-inline-start:3px solid var(--c,var(--line-strong))}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 13px;background:var(--surface-2)}
.sec-h h4{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.sec-h .n{font-size:11px;color:var(--muted);font-weight:600}
.sec ul{list-style:none;margin:0;padding:4px 13px 10px}
.sec li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.sec li:last-child{border-bottom:0}
.sec .im{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:10.5px;color:var(--muted-2)}
.sec.empty .body{padding:10px 13px;color:var(--muted-2);font-size:12.5px}

/* ── journal ───────────────────────────────────────── */
.jwrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 20px;margin-top:20px}
.jwrap h3{font-size:15px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.tl{position:relative;padding-inline-start:20px}
.tl::before{content:"";position:absolute;inset-inline-start:4px;top:6px;bottom:10px;width:1px;background:var(--line-strong)}
.ev{position:relative;padding-bottom:16px}
.ev::before{content:"";position:absolute;inset-inline-start:-20px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--accent))}
.ev .t{font-weight:600;font-size:14px}
.ev .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);margin-top:3px}
.ev .b{color:var(--ink-2);font-size:13px;margin-top:6px;white-space:pre-wrap;max-width:70ch;border-inline-start:2px solid var(--line);padding-inline-start:10px}

/* ── platform brain / tables ───────────────────────── */
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:16px;overflow:hidden}
.panel > h3{font-size:14px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);display:flex;justify-content:space-between;align-items:center}
.panel .pb{padding:6px 16px 14px}
.kv{list-style:none;margin:0;padding:0}
.kv li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--ink-2)}
.kv li:last-child{border-bottom:0}
.kv b{color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:700;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}

/* ── report ────────────────────────────────────────── */
.rgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:940px){.rgrid{grid-template-columns:1fr}}
.form{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;position:sticky;top:74px}
@media (max-width:940px){.form{position:static}}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2);font-weight:700;margin-bottom:4px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;font-size:13.5px}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;padding:3px 0;color:var(--ink-2)}
.chk input{accent-color:var(--accent)}
.go{width:100%;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;font-family:var(--display);font-size:14px}
.go:hover{background:#233457}
:root[data-theme="dark"] .go{background:var(--accent);color:#10162a}
.report{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:26px 30px;box-shadow:var(--shadow)}
.rep-h{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.rep-h .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-ink);font-weight:700}
.rep-h h2{font-size:25px;margin-top:4px}
.rep-h .meta{color:var(--muted);font-size:12.5px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.rsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.rsum div{background:var(--surface);padding:10px 13px}
.rsum .v{font-family:var(--display);font-size:20px;font-weight:700}
.rsum .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:600}
.rproj{padding:16px 0;border-top:1px solid var(--line)}
.rproj h3{font-size:16px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.rgroup{font-family:var(--display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink);margin:22px 0 2px}
.rsec{margin-top:10px}
.rsec h5{font-size:12px;font-weight:700;color:var(--ink-2);margin:0 0 3px}
.rsec ul{margin:0;padding-inline-start:18px;font-size:13px;color:var(--ink-2)}
.rsec li{margin:2px 0}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.printbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

@media print{
  @page{size:A4;margin:14mm}
  .top,.rail,.form,.printbar,.notice,.tabs,.tools,.filters{display:none!important}
  body{background:#fff;color:#000;font-size:11px}
  main{padding:0;max-width:none}
  .rgrid{grid-template-columns:1fr}
  .report{border:0;box-shadow:none;padding:0}
  .rproj{break-inside:avoid}
  a{color:#000}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('mb-data').textContent);
const V = DATA.vocab;

/* ── strings ─────────────────────────────────────── */
const S = {
 ar:{portfolio:"المحفظة",project:"المشروع",platform:"العقل العام",report:"تقرير",
   snapshot:"لقطة حيّة",snapNote:"نسخة للقراءة من بيانات المنصة المثبّتة في E:\\master. للتعديل والتسجيل استخدم اللوحة المحلية أو أدوات Claude.",
   generated:"صدرت",projects:"مشاريع",avgProgress:"متوسط الإنجاز",entries:"مدخلات السجل",suggestions:"مقترحات النماذج",pending:"طلبات معلّقة",
   all:"الكل",priority:"أولوية",lastActivity:"آخر نشاط",progress:"الإنجاز",revenue:"دخل",
   now:"الحالة الآن",settled:"ما استقرّ",improve:"التحسين",journal:"سجل التقدّم",entriesN:"مدخلة",nothing:"لا شيء بعد",
   sessions:"جلسات مرتبطة",created:"أُنشئ",updated:"حُدِّث",
   reportTitle:"تقرير متابعة المشاريع",period:"الفترة",allTime:"كل الفترات",from:"من",to:"إلى",group:"التجميع",none:"بدون",byStatus:"حسب الحالة",byPriority:"حسب الأولوية",
   include:"يشمل",incBrain:"العقل الهندسي",incJournal:"سجل الفترة",incPlatform:"العقل العام",build:"إنشاء التقرير",print:"طباعة / حفظ PDF",
   selectProjects:"المشاريع",noEntries:"لا مدخلات في هذه الفترة.",inPeriod:"في الفترة",
   learned:"دروس",skills:"مهارات",tools:"أدوات",capabilities:"قدرات",requests:"طلبات أدوات",
   status:"الحالة",name:"الاسم",note:"ملاحظة",source:"المصدر",by:"بواسطة",date:"التاريخ",kind:"النوع"},
 en:{portfolio:"Portfolio",project:"Project",platform:"Platform brain",report:"Report",
   snapshot:"Live snapshot",snapNote:"Read-only copy of the platform data installed at E:\\master. Edit and log through the local dashboard or Claude's tools.",
   generated:"Generated",projects:"Projects",avgProgress:"Avg progress",entries:"Journal entries",suggestions:"Model suggestions",pending:"Pending requests",
   all:"All",priority:"Priority",lastActivity:"Last activity",progress:"Progress",revenue:"Revenue",
   now:"State now",settled:"Settled",improve:"Improve",journal:"Progress journal",entriesN:"entries",nothing:"Nothing yet",
   sessions:"Linked sessions",created:"Created",updated:"Updated",
   reportTitle:"Portfolio progress report",period:"Period",allTime:"All time",from:"From",to:"To",group:"Group by",none:"None",byStatus:"Status",byPriority:"Priority",
   include:"Include",incBrain:"Engineering mind",incJournal:"Journal in period",incPlatform:"Platform brain",build:"Build report",print:"Print / Save PDF",
   selectProjects:"Projects",noEntries:"No entries in this period.",inPeriod:"in period",
   learned:"Lessons",skills:"Skills",tools:"Tools",capabilities:"Capabilities",requests:"Tool requests",
   status:"Status",name:"Name",note:"Note",source:"Source",by:"By",date:"Date",kind:"Kind"}
};
let lang = 'ar';
try{ lang = localStorage.getItem('mb.lang') || 'ar'; }catch(e){}
const t = k => (S[lang][k] !== undefined ? S[lang][k] : (S.en[k] || k));
const L = v => v == null ? '' : (typeof v === 'string' ? v : (v[lang] || v.ar || v.en || ''));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vl = (list,key) => { const f = list.find(x => String(x.key) === String(key)); return f ? (f[lang] || f.en) : String(key == null ? '' : key); };
const vget = (list,key) => list.find(x => String(x.key) === String(key)) || {};

function fmt(v, withTime){
  if(!v) return '';
  const d = new Date(v); if(isNaN(d)) return String(v);
  try{
    const p = new Intl.DateTimeFormat('en-GB',{timeZone:DATA.timezone||'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
      .formatToParts(d).reduce(function(a,x){a[x.type]=x.value;return a;},{});
    return p.year+'-'+p.month+'-'+p.day + (withTime ? ' '+(p.hour==='24'?'00':p.hour)+':'+p.minute : '');
  }catch(e){ return d.toISOString().slice(0, withTime?16:10).replace('T',' '); }
}
const MODEL_C = {claude:'var(--warn)',opus:'var(--violet)',sonnet:'var(--info)',haiku:'var(--ok)',fable:'var(--accent)',human:'var(--muted)',other:'var(--muted-2)'};
const modelPill = m => '<span class="pill model" style="--c:'+(MODEL_C[m]||'var(--muted)')+'">'+esc(vl(V.models,m))+'</span>';
const statusPill = s => '<span class="pill status st '+esc(s)+'">'+esc(vl(V.statuses,s))+'</span>';

/* ── state ───────────────────────────────────────── */
const st = { view:'portfolio', pid:DATA.projects[0] && DATA.projects[0].id, filter:'all', report:null };
try{ const sv = localStorage.getItem('mb.pid'); if(sv && DATA.projects.some(p=>p.id===sv)) st.pid = sv; }catch(e){}

const SECTION_GROUPS = [
  {key:'now', keys:['current','next','blockers'], colors:{current:'var(--info)',next:'var(--accent)',blockers:'var(--bad)'}},
  {key:'settled', keys:['done','findings','decisions'], colors:{done:'var(--ok)',findings:'var(--info)',decisions:'var(--violet)'}},
  {key:'improve', keys:['improvements','suggestions','constraints'], colors:{improvements:'var(--accent)',suggestions:'var(--violet)',constraints:'var(--muted)'}}
];
const TYPE_C = {progress:'var(--info)',milestone:'var(--ok)',decision:'var(--violet)',blocker:'var(--bad)',suggestion:'var(--accent)',note:'var(--muted)',report:'var(--muted-2)'};

/* ── views ───────────────────────────────────────── */
function strip(){
  const s = DATA.stats;
  const cells = [
    {k:t('projects'), v:s.projects, sub:Object.keys(s.byStatus).filter(k=>s.byStatus[k]).map(k=>s.byStatus[k]+' '+vl(V.statuses,k)).join(' · ')},
    {k:t('avgProgress'), v:s.avgProgress+'%', meter:s.avgProgress},
    {k:t('entries'), v:s.journalEntries},
    {k:t('suggestions'), v:s.suggestions, sub:Object.keys(s.suggestionsByModel||{}).map(m=>vl(V.models,m)+' '+s.suggestionsByModel[m]).join(' · ')},
    {k:t('pending'), v:(s.toolRequestsPending||0)+(s.pendingRequests||0)},
    {k:t('generated'), v:'<span style="font-size:14px">'+fmt(DATA.generated,false)+'</span>', sub:'v'+DATA.version}
  ];
  return '<div class="strip">'+cells.map(c=>'<div class="cell"><div class="k">'+esc(c.k)+'</div><div class="v num">'+c.v+'</div>'+
    (c.meter!=null?'<div class="meterline"><i style="width:'+c.meter+'%"></i></div>':'')+
    (c.sub?'<div class="sub">'+esc(c.sub)+'</div>':'')+'</div>').join('')+'</div>';
}
function rail(){
  const counts = {all:DATA.projects.length};
  DATA.projects.forEach(p=>{counts[p.status]=(counts[p.status]||0)+1;});
  const keys = ['all'].concat(V.statuses.map(s=>s.key).filter(k=>counts[k]));
  const list = DATA.projects.filter(p=> st.filter==='all' || p.status===st.filter);
  return '<aside class="rail"><div class="rail-h"><span>'+esc(t('projects'))+'</span><span class="mono num">'+list.length+'/'+DATA.projects.length+'</span></div>'+
   '<div class="filters">'+keys.map(k=>'<button data-f="'+k+'" aria-pressed="'+(st.filter===k)+'">'+esc(k==='all'?t('all'):vl(V.statuses,k))+' '+(counts[k]||0)+'</button>').join('')+'</div>'+
   '<ul class="plist">'+list.map(p=>'<li><button class="prow" data-p="'+esc(p.id)+'" aria-current="'+(p.id===st.pid&&st.view==='project')+'">'+
     '<span class="pn">'+esc(L(p.name))+'</span>'+
     '<span class="pm"><span>'+statusPill(p.status)+' <span class="mono">P'+(p.priority||'-')+'</span></span><span class="mono num">'+p.progress+'%</span></span>'+
     '<span class="bar"><i style="width:'+p.progress+'%"></i></span>'+
     '<span class="pm"><span class="mono">'+esc(p.id)+'</span><span class="mono num">'+fmt(p.lastActivity,false)+'</span></span>'+
     '</button></li>').join('')+'</ul></aside>';
}
function projectView(p){
  const alt = lang==='ar' ? (p.name.en||'') : (p.name.ar||'');
  let h = '<div class="phead"><h2>'+esc(L(p.name))+'</h2>'+(alt?'<div class="alt">'+esc(alt)+'</div>':'')+
    (L(p.description)?'<p>'+esc(L(p.description))+'</p>':'')+
    '<div class="gauge"><b class="num">'+p.progress+'%</b><span class="bar"><i style="width:'+p.progress+'%"></i></span>'+statusPill(p.status)+
      '<span class="pill tag">'+esc(t('priority'))+' '+(p.priority||'—')+'</span>'+
      (p.revenue==='yes'?'<span class="pill tag">'+esc(t('revenue'))+'</span>':'')+'</div>'+
    '<div class="tagrow"><span class="pill tag mono">'+esc(p.id)+'</span>'+
      (p.tags||[]).map(x=>'<span class="pill tag">#'+esc(x)+'</span>').join('')+
      (p.sessions||[]).map(x=>'<span class="pill tag mono">'+esc(x)+'</span>').join('')+
      '<span class="pill tag">'+esc(t('created'))+' '+fmt(p.created,false)+'</span>'+
      '<span class="pill tag">'+esc(t('lastActivity'))+' '+fmt(p.lastActivity,false)+'</span></div></div>';

  h += '<div class="brain">'+SECTION_GROUPS.map(function(g){
    const total = g.keys.reduce(function(a,k){return a+((p.brain[k]||[]).length);},0);
    return '<div><div class="colhead"><span>'+esc(t(g.key))+'</span><span class="num">'+total+'</span></div>'+
      g.keys.map(function(k){
        const meta = vget(V.sections,k), items = p.brain[k]||[];
        const head = '<div class="sec-h"><h4>'+esc(meta.icon||'')+' '+esc(lang==='ar'?meta.ar:meta.en)+'</h4><span class="n num">'+items.length+'</span></div>';
        if(!items.length) return '<section class="sec empty" style="--c:'+g.colors[k]+'">'+head+'<div class="body">'+esc(t('nothing'))+'</div></section>';
        return '<section class="sec" style="--c:'+g.colors[k]+'">'+head+'<ul>'+items.map(function(it){
          return '<li>'+esc(it.text)+'<div class="im">'+
            ((k==='suggestions'||it.by!=='human')?modelPill(it.by):'')+
            (k==='suggestions'&&it.status?'<span class="pill tag">'+esc(it.status)+'</span>':'')+
            '<span class="mono num">'+fmt(it.date,false)+'</span></div></li>';
        }).join('')+'</ul></section>';
      }).join('')+'</div>';
  }).join('')+'</div>';

  h += '<div class="jwrap"><h3>🗓️ '+esc(t('journal'))+' <span class="n mono num" style="color:var(--muted);font-weight:400">'+p.journal.length+' '+esc(t('entriesN'))+'</span></h3><div class="tl">'+
    (p.journal.length? p.journal.map(function(e){
      const ty = vget(V.types,e.type);
      return '<div class="ev" style="--c:'+(TYPE_C[e.type]||'var(--accent)')+'"><div class="t">'+esc(ty.icon||'')+' '+esc(e.title)+'</div>'+
       '<div class="m"><span class="mono num">'+fmt(e.date,true)+'</span><span class="pill tag">'+esc(vl(V.types,e.type))+'</span>'+modelPill(e.model)+
       (e.progress!=null?'<span class="pill tag num">'+e.progress+'%</span>':'')+'</div>'+
       (e.body?'<div class="b">'+esc(e.body)+'</div>':'')+'</div>';
    }).join('') : '<div class="hint">'+esc(t('nothing'))+'</div>')+'</div></div>';
  return h;
}
function platformView(){
  const pb = DATA.platform;
  const blocks = V.kinds.map(function(k){
    const items = pb[k.key]||[];
    return '<section class="panel"><h3>'+esc(lang==='ar'?k.ar:k.en)+'<span class="mono num" style="color:var(--muted)">'+items.length+'</span></h3><div class="pb">'+
      (items.length?'<ul class="kv">'+items.map(function(it){
        return '<li>'+(it.name?'<b>'+esc(it.name)+'</b> — ':'')+esc(it.text)+
          '<div class="im" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:11px;color:var(--muted-2)">'+
          modelPill(it.by)+(it.status?'<span class="pill tag">'+esc(it.status)+'</span>':'')+
          (it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noopener" class="mono">'+esc(it.url.replace(/^https?:\/\//,''))+'</a>':'')+
          (it.install?'<code class="mono">'+esc(it.install)+'</code>':'')+
          (it.command?'<code class="mono">'+esc(it.command)+'</code>':'')+
          '<span class="mono num">'+fmt(it.date,false)+'</span></div></li>';
      }).join('')+'</ul>':'<div class="hint">'+esc(t('nothing'))+'</div>')+'</div></section>';
  });
  return '<div class="two">'+blocks.join('')+'</div>';
}

/* ── report ──────────────────────────────────────── */
function reportForm(){
  const today = new Date(), ago = new Date(Date.now()-29*864e5);
  const iso = d => d.toISOString().slice(0,10);
  return '<aside class="form">'+
   '<div class="field"><label>'+esc(t('from'))+'</label><input type="date" id="r-from" value="'+iso(ago)+'"></div>'+
   '<div class="field"><label>'+esc(t('to'))+'</label><input type="date" id="r-to" value="'+iso(today)+'"></div>'+
   '<div class="field"><label>'+esc(t('selectProjects'))+'</label>'+DATA.projects.map(function(p){
     return '<label class="chk"><input type="checkbox" name="rp" value="'+esc(p.id)+'" checked> '+esc(L(p.name))+'</label>';}).join('')+'</div>'+
   '<div class="field"><label>'+esc(t('group'))+'</label><select id="r-group"><option value="none">'+esc(t('none'))+'</option><option value="status">'+esc(t('byStatus'))+'</option><option value="priority">'+esc(t('byPriority'))+'</option></select></div>'+
   '<div class="field"><label>'+esc(t('include'))+'</label>'+
     '<label class="chk"><input type="checkbox" id="r-brain" checked> '+esc(t('incBrain'))+'</label>'+
     '<label class="chk"><input type="checkbox" id="r-journal" checked> '+esc(t('incJournal'))+'</label>'+
     '<label class="chk"><input type="checkbox" id="r-platform"> '+esc(t('incPlatform'))+'</label></div>'+
   '<button class="go" id="r-go">'+esc(t('build'))+'</button></aside>';
}
function buildReport(){
  const from = document.getElementById('r-from').value, to = document.getElementById('r-to').value;
  const ids = Array.prototype.slice.call(document.querySelectorAll('input[name="rp"]:checked')).map(i=>i.value);
  const group = document.getElementById('r-group').value;
  const inc = {brain:document.getElementById('r-brain').checked, journal:document.getElementById('r-journal').checked, platform:document.getElementById('r-platform').checked};
  const f = from? new Date(from+'T00:00:00') : null, tt = to? new Date(to+'T23:59:59') : null;
  const inRange = d => { const x = new Date(d); if(isNaN(x)) return false; if(f && x<f) return false; if(tt && x>tt) return false; return true; };
  const rows = DATA.projects.filter(p=>ids.indexOf(p.id)>-1).map(function(p){
    const entries = p.journal.filter(e=>inRange(e.date));
    const brain = {}; Object.keys(p.brain).forEach(k=>{brain[k]=p.brain[k];});
    return {p:p, entries:entries, brain:brain};
  });
  st.report = {from:from,to:to,group:group,inc:inc,rows:rows};
  render();
  const el = document.getElementById('report-out'); if(el) el.scrollIntoView({block:'start',behavior:'smooth'});
}
function reportOut(){
  const r = st.report;
  if(!r) return '<div class="report"><div class="rep-h"><div class="eyebrow">'+esc(t('report'))+'</div><h2>'+esc(t('reportTitle'))+'</h2></div><p class="hint">'+esc(t('build'))+' ←</p></div>';
  const entries = r.rows.reduce((a,x)=>a+x.entries.length,0);
  const sugg = r.rows.reduce((a,x)=>a+(x.brain.suggestions||[]).length,0);
  const avg = r.rows.length? Math.round(r.rows.reduce((a,x)=>a+x.p.progress,0)/r.rows.length):0;
  const period = (r.from||r.to) ? (r.from||'…')+' → '+(r.to||'…') : t('allTime');
  let groups;
  if(r.group==='status') groups = V.statuses.map(s=>({label:(lang==='ar'?s.ar:s.en), rows:r.rows.filter(x=>x.p.status===s.key)})).filter(g=>g.rows.length);
  else if(r.group==='priority') groups = V.priorities.map(p=>({label:(lang==='ar'?p.ar:p.en), rows:r.rows.filter(x=>(x.p.priority||0)===p.key)})).filter(g=>g.rows.length);
  else groups = [{label:null, rows:r.rows}];

  let h = '<div class="printbar"><span class="hint">'+esc(period)+' · '+r.rows.length+' '+esc(t('projects'))+'</span><button class="icon-btn" id="r-print">🖨 '+esc(t('print'))+'</button></div>';
  h += '<article class="report" id="report-out"><div class="rep-h"><div class="eyebrow">'+esc(L(DATA.platformName))+'</div><h2>'+esc(t('reportTitle'))+'</h2>'+
    '<div class="meta"><span>'+esc(t('period'))+': <b>'+esc(period)+'</b></span><span>'+esc(t('generated'))+': '+fmt(new Date().toISOString(),true)+'</span></div></div>';
  h += '<div class="rsum">'+[[t('projects'),r.rows.length],[t('avgProgress'),avg+'%'],[t('entries')+' ('+t('inPeriod')+')',entries],[t('suggestions'),sugg]]
    .map(x=>'<div><div class="v num">'+esc(x[1])+'</div><div class="k">'+esc(x[0])+'</div></div>').join('')+'</div>';
  h += '<div class="scroll"><table><thead><tr><th>'+esc(t('projects'))+'</th><th>'+esc(t('status'))+'</th><th>'+esc(t('priority'))+'</th><th>'+esc(t('progress'))+'</th><th>'+esc(t('entries'))+'</th><th>'+esc(t('lastActivity'))+'</th></tr></thead><tbody>'+
    r.rows.map(x=>'<tr><td><b>'+esc(L(x.p.name))+'</b><br><span class="mono" style="color:var(--muted)">'+esc(x.p.id)+'</span></td><td>'+statusPill(x.p.status)+'</td><td class="num">'+(x.p.priority||'—')+'</td><td class="num">'+x.p.progress+'%</td><td class="num">'+x.entries.length+'</td><td class="mono num">'+fmt(x.p.lastActivity,false)+'</td></tr>').join('')+
    '</tbody></table></div>';
  groups.forEach(function(g){
    if(g.label) h += '<div class="rgroup">'+esc(g.label)+' · '+g.rows.length+'</div>';
    g.rows.forEach(function(x){
      h += '<section class="rproj"><h3>'+esc(L(x.p.name))+' <span class="mono" style="color:var(--muted);font-weight:400">'+esc(x.p.id)+'</span> '+statusPill(x.p.status)+' <span class="num" style="color:var(--muted)">'+x.p.progress+'%</span></h3>';
      if(r.inc.brain){
        V.sections.forEach(function(s){
          const items = x.brain[s.key]||[]; if(!items.length) return;
          h += '<div class="rsec"><h5>'+esc(s.icon||'')+' '+esc(lang==='ar'?s.ar:s.en)+'</h5><ul>'+items.map(function(it){
            return '<li>'+esc(it.text)+(s.key==='suggestions'?' <span style="color:var(--muted)">— '+esc(vl(V.models,it.by))+(it.status?' ('+esc(it.status)+')':'')+'</span>':'')+'</li>';}).join('')+'</ul></div>';
        });
      }
      if(r.inc.journal){
        h += '<div class="rsec"><h5>🗓️ '+esc(t('journal'))+'</h5>'+ (x.entries.length? '<ul>'+x.entries.map(function(e){
          return '<li><span class="mono num">'+fmt(e.date,false)+'</span> — '+esc(e.title)+(e.progress!=null?' <b class="num">('+e.progress+'%)</b>':'')+' <span style="color:var(--muted)">'+esc(vl(V.models,e.model))+'</span>'+(e.body?'<br><span style="color:var(--muted)">'+esc(e.body)+'</span>':'')+'</li>';
        }).join('')+'</ul>' : '<p class="hint">'+esc(t('noEntries'))+'</p>')+'</div>';
      }
      h += '</section>';
    });
  });
  if(r.inc.platform){
    h += '<div class="rgroup">'+esc(t('platform'))+'</div>';
    V.kinds.forEach(function(k){
      const items = DATA.platform[k.key]||[]; if(!items.length) return;
      h += '<div class="rsec"><h5>'+esc(lang==='ar'?k.ar:k.en)+'</h5><ul>'+items.map(it=>'<li>'+(it.name?'<b>'+esc(it.name)+'</b> — ':'')+esc(it.text)+(it.status?' ['+esc(it.status)+']':'')+'</li>').join('')+'</ul></div>';
    });
  }
  h += '</article>';
  return h;
}

/* ── render ──────────────────────────────────────── */
function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.getElementById('bn').textContent = lang==='ar' ? 'ماستر برين' : 'Master Brain';
  document.getElementById('bt').textContent = lang==='ar' ? 'منصة المتابعة والعقل الهندسي' : 'Portfolio tracker & engineering mind';
  document.getElementById('lang-btn').textContent = lang==='ar' ? 'EN' : 'ع';
  const views = ['portfolio','project','platform','report'];
  document.getElementById('tabs').innerHTML = views.map(v=>'<button role="tab" data-v="'+v+'" aria-selected="'+(st.view===v)+'">'+esc(t(v))+'</button>').join('');

  const notice = '<div class="notice"><span class="dot"></span><div><b>'+esc(t('snapshot'))+'</b> · '+esc(t('generated'))+' '+fmt(DATA.generated,true)+' — '+esc(t('snapNote'))+'</div></div>';
  const app = document.getElementById('app');
  const p = DATA.projects.filter(x=>x.id===st.pid)[0] || DATA.projects[0];

  if(st.view==='portfolio'){
    app.innerHTML = notice + strip() + '<div class="split">'+rail()+'<div>'+projectView(p)+'</div></div>';
  } else if(st.view==='project'){
    app.innerHTML = notice + '<div class="split">'+rail()+'<div>'+projectView(p)+'</div></div>';
  } else if(st.view==='platform'){
    app.innerHTML = notice + strip() + platformView();
  } else {
    app.innerHTML = notice + '<div class="rgrid">'+reportForm()+'<div>'+reportOut()+'</div></div>';
    const go = document.getElementById('r-go'); if(go) go.onclick = buildReport;
    const pr = document.getElementById('r-print'); if(pr) pr.onclick = function(){ window.print(); };
  }
  bind();
}
function bind(){
  document.querySelectorAll('[data-v]').forEach(function(b){ b.onclick = function(){ st.view = b.dataset.v; render(); window.scrollTo({top:0}); }; });
  document.querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ st.pid = b.dataset.p; st.view='project'; try{localStorage.setItem('mb.pid',st.pid);}catch(e){} render(); }; });
  document.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ st.filter = b.dataset.f; render(); }; });
}
document.getElementById('lang-btn').onclick = function(){ lang = lang==='ar' ? 'en' : 'ar'; try{localStorage.setItem('mb.lang',lang);}catch(e){} st.report=null; render(); };
document.getElementById('theme-btn').onclick = function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  try{ localStorage.setItem('mb.theme', dark?'light':'dark'); }catch(e){}
};
try{ const th = localStorage.getItem('mb.theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
render();
})();
</script>
