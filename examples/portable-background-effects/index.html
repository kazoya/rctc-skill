<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particles + Parallax (portable demo)</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: system-ui, sans-serif;
      color: #fff;
      background: #0a1944;
    }
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    /* Canvas must sit INSIDE hero, above bg, below text (like ITB banner) */
    #nodes {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, rgba(10,25,100,.55), rgba(25,50,150,.45));
      pointer-events: none;
    }
    .hero .block {
      position: relative;
      z-index: 2;
      max-width: 720px;
      line-height: 1.7;
    }
    .content { position: relative; z-index: 2; }
    .jarallax-section {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      background-size: cover;
      background-position: center;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 1rem; }
    p { opacity: 0.95; }
    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-overlay" aria-hidden="true"></div>
    <canvas id="nodes"></canvas>
    <div class="block">
      <h1>حرّك الفأرة هنا — الجسيمات تتفاعل</h1>
      <p>nodes.js (MIT) — نفس فكرة خلفية itb.com.sa</p>
      <p class="hint">التأثير خفيف داخل دائرة ~50px حول المؤشر</p>
    </div>
  </section>

  <div class="content">
    <section class="jarallax jarallax-section" data-jarallax data-speed="0.3"
      style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1600&q=80');">
      <div class="block">
        <h1>Parallax عند التمرير</h1>
        <p>jarallax — data-speed 0.3</p>
      </div>
    </section>
  </div>

  <script src="js/nodes.js"></script>
  <script>
    var nodesjs = new NodesJs({
      id: 'nodes',
      width: window.innerWidth,
      height: window.innerHeight,
      particleSize: 3,
      lineSize: 1,
      particleColor: [255, 255, 255, 0.45],
      lineColor: '255,255,255',
      backgroundFrom: [10, 25, 100],
      backgroundTo: [25, 50, 150],
      backgroundDuration: 5000,
      nobg: true,
      number: 80,
      speed: 15,
      pointerCircleRadius: 120
    });

    window.addEventListener('resize', function () {
      nodesjs.setWidth(window.innerWidth);
      nodesjs.setHeight(window.innerHeight);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jarallax@2/dist/jarallax.min.js"></script>
  <script>jarallax(document.querySelectorAll('.jarallax'));</script>
</body>
</html>
